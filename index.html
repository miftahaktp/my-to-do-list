<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>My To Do List</h1>
        
        <button id="clearAllBtn" onclick="tumunuSil()">Tümünü Sil</button>

        <div class="input-container">
            <input type="text" id="todoInput" placeholder="Metin girin...">
            <div class="options-row">
                <input type="date" id="todoDate">
                <select id="todoCategory">
                    <option value="Genel">Genel</option>
                    <option value="Ders">Ders</option>
                    <option value="İş">İş</option>
                    <option value="Kişisel">Kişisel</option>
                </select>
            </div>
            <button onclick="elemanEkle()">Görev Ekle</button>
        </div>

        <div class="filter-container">
            <button class="filter-btn active" onclick="filtrele('hepsi', this)">Tümü</button>
            <button class="filter-btn" onclick="filtrele('bekleyen', this)">Bekleyenler</button>
            <button class="filter-btn" onclick="filtrele('tamamlanan', this)">Tamamlananlar</button>
        </div>

        <ul id="todoList"></ul>

        <div id="counter" class="counter-text">Toplam Görev: 0</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
